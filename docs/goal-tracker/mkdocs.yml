site_name: Goals Tracker Documentation
site_description: Complete documentation for Goals Tracker application
site_author: Goals Tracker Team

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
  - Architecture:
      - Overview: architecture/overview.md
      - Backend: architecture/backend.md
      - Frontend: architecture/frontend.md
      - Database: architecture/database.md
  - Development:
      - Backend Development: development/backend.md
      - Frontend Development: development/frontend.md
      - Docker Setup: development/docker.md
  - CI/CD:
      - GitHub Actions: ci-cd/github-actions.md
      - Deployment: ci-cd/deployment.md
  - API Reference:
      - Authentication: api/authentication.md
      - Goals: api/goals.md
      - Habits: api/habits.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
  - codehilite
  - toc:
      permalink: true
